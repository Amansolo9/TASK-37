{% extends "base.html" %}
{% block title %}Schedule - Dispatch{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Schedule</h2>
    <div>
        <form method="POST" action="{{ url_for('dispatch.auto_assign') }}" class="d-inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-outline-warning btn-sm" type="submit">Auto-Assign Unscheduled</button>
        </form>
        <a href="{{ url_for('dispatch.suggest') }}" class="btn btn-outline-info btn-sm">Semi-Auto Suggest</a>
        <a href="{{ url_for('dispatch.schedule_new') }}" class="btn btn-success btn-sm">New Item</a>
    </div>
</div>
<div class="row mb-3 g-2">
    <div class="col-auto"><input type="text" name="date" class="form-control" placeholder="MM/DD/YYYY" value="{{ current_date or '' }}" hx-get="{{ url_for('htmx_api.htmx_schedule_list') }}" hx-target="#schedule-table" hx-trigger="change"></div>
    <div class="col-auto">
        <select name="status" class="form-select" hx-get="{{ url_for('htmx_api.htmx_schedule_list') }}" hx-target="#schedule-table" hx-trigger="change">
            <option value="">All Statuses</option>
            {% for s in ['draft','scheduled','conflict','completed','canceled'] %}<option value="{{ s }}" {% if current_status == s %}selected{% endif %}>{{ s|title }}</option>{% endfor %}
        </select>
    </div>
</div>
<div id="schedule-table">
    {% include "dispatch/schedule_partial.html" %}
</div>
{% endblock %}
