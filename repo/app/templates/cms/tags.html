{% extends "base.html" %}
{% block title %}Tags - CMS{% endblock %}
{% block content %}
<h2>Tags</h2>
<div class="row">
    <div class="col-md-4">
        <form method="POST" action="{{ url_for('cms.tag_add') }}" hx-post="{{ url_for('cms.tag_add') }}" hx-target="#tag-list">
            {{ form.hidden_tag() }}
            <div class="input-group mb-3">
                {{ form.name(class="form-control", placeholder="New tag name") }}
                <button class="btn btn-success" type="submit">Add</button>
            </div>
        </form>
    </div>
    <div class="col-md-8" id="tag-list">
        {% include "cms/tags_partial.html" %}
    </div>
</div>
{% endblock %}
