<table class="table table-sm">
    <thead><tr><th>Name</th><th>Slug</th><th>Active</th></tr></thead>
    <tbody>
    {% for t in tags %}
    <tr><td>{{ t.name }}</td><td><code>{{ t.slug }}</code></td><td>{% if t.active %}<span class="badge bg-success">Yes</span>{% else %}<span class="badge bg-secondary">No</span>{% endif %}</td></tr>
    {% endfor %}
    {% if not tags %}<tr><td colspan="3" class="text-muted text-center">No tags.</td></tr>{% endif %}
    </tbody>
</table>
