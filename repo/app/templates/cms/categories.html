{% extends "base.html" %}
{% block title %}Categories - CMS{% endblock %}
{% block content %}
<h2>Categories</h2>
<div class="row">
    <div class="col-md-4">
        <form method="POST" action="{{ url_for('cms.category_add') }}" hx-post="{{ url_for('cms.category_add') }}" hx-target="#cat-list">
            {{ form.hidden_tag() }}
            <div class="input-group mb-3">
                {{ form.name(class="form-control", placeholder="New category name") }}
                <button class="btn btn-success" type="submit">Add</button>
            </div>
        </form>
    </div>
    <div class="col-md-8" id="cat-list">
        {% include "cms/categories_partial.html" %}
    </div>
</div>
{% endblock %}
